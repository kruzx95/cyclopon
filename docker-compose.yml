services:
  cyclopon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyclopon-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TRACCAR_HOST=http://traccar:8082
      - TRACCAR_USER=${TRACCAR_USER:-admin}
      - TRACCAR_PASS=${TRACCAR_PASS:-admin}
      - SESSION_SECRET=${SESSION_SECRET:-cyclopon_production_secret_key_change_me}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - NOTIF_SOS_ENABLED=${NOTIF_SOS_ENABLED:-true}
      - NOTIF_COT_ENABLED=${NOTIF_COT_ENABLED:-true}
    volumes:
      - cyclopon_data:/app/data
      - cyclopon_gpx:/app/public/gpx
    depends_on:
      - traccar
    networks:
      - cyclopon-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  traccar:
    image: traccar/traccar:alpine
    container_name: cyclopon-traccar
    restart: unless-stopped
    ports:
      - "5055:5055"   # OsmAnd GPS protocol port (rider phones send updates here)
      - "8082:8082"   # Traccar Web Dashboard & Internal WebSocket
    volumes:
      - ./docker/traccar/traccar.xml:/opt/traccar/conf/traccar.xml:ro
      - traccar_data:/opt/traccar/data
      - traccar_logs:/opt/traccar/logs
    networks:
      - cyclopon-net

volumes:
  cyclopon_data:
    name: cyclopon_data
  cyclopon_gpx:
    name: cyclopon_gpx
  traccar_data:
    name: cyclopon_traccar_data
  traccar_logs:
    name: cyclopon_traccar_logs

networks:
  cyclopon-net:
    name: cyclopon-net
    driver: bridge
